name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  OPENCV4NODEJS_DISABLE_AUTOBUILD: '1'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/api prisma:generate

      - name: Workspace lint
        run: pnpm -r lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/api prisma:generate

      - name: Workspace typecheck
        run: pnpm -r typecheck

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pokecard:pokecard@localhost:5432/pokecard
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokecard
          POSTGRES_PASSWORD: pokecard
          POSTGRES_DB: pokecard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokecard -d pokecard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/api prisma:generate

      - name: Prepare API test database
        run: pnpm -C apps/api exec prisma db push

      - name: Validate DB integration test prerequisites
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL is required" && exit 1)

      - name: API tests (non-DB)
        env:
          RUN_DB_INTEGRATION_TESTS: 'false'
        run: pnpm -C apps/api test

      - name: API DB integration tests (required)
        env:
          RUN_DB_INTEGRATION_TESTS: 'true'
        run: pnpm -C apps/api test -- tests/db-integration.test.ts

      - name: Web and shared tests
        run: pnpm -r --filter @pokecard/web --filter @pokecard/shared test

      - name: Install Playwright browser
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Web E2E tests
        run: pnpm -C apps/web test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/api prisma:generate

      - name: Workspace build
        run: pnpm -r build
