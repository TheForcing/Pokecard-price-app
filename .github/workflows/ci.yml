name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pokecard:pokecard@localhost:5432/pokecard
      REDIS_URL: redis://localhost:6379
      RUN_DB_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokecard
          POSTGRES_PASSWORD: pokecard
          POSTGRES_DB: pokecard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokecard -d pokecard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare API test database
        run: pnpm -C apps/api exec prisma db push

      - name: API tests (required)
        run: pnpm -C apps/api test

      - name: Web and shared tests
        run: pnpm -r --filter @pokecard/web --filter @pokecard/shared test

      - name: Workspace typecheck
        run: pnpm -r typecheck
