services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pokecard
      POSTGRES_PASSWORD: pokecard
      POSTGRES_DB: pokecard
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  postgres_data:
