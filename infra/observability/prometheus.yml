global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pokecard-api-health
    metrics_path: /health/metrics/prometheus
    static_configs:
      - targets:
          - host.docker.internal:4000

  - job_name: pokecard-api-recognize
    metrics_path: /recognize/metrics/prometheus
    static_configs:
      - targets:
          - host.docker.internal:4000
