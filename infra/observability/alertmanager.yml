global:
  resolve_timeout: 5m

route:
  receiver: default-log
  group_by: ['alertname', 'provider']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: default-log

  - name: slack-webhook
    slack_configs:
      - api_url: https://example.invalid/slack-webhook
        channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

  - name: email-alert
    email_configs:
      - to: ops@example.com
        from: alertmanager@example.com
        smarthost: smtp.example.com:587
        auth_username: alertmanager@example.com
        auth_password: change-me
        require_tls: true
